# docker compose up -d   then open http://localhost:8787
services:
  folio:
    build:
      context: .
      args:
        # In mainland China: NPM_REGISTRY=https://registry.npmmirror.com docker compose build
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: folio
    restart: unless-stopped
    env_file: .env
    ports:
      # Only this machine can reach it. There is no login, so opening it to the
      # network (BIND=0.0.0.0) lets anyone there see and change the profile.
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - folio-data:/data

volumes:
  folio-data:
